# Netlify: Next.js 16 + @netlify/plugin-nextjs (OpenNext).
#
# Dashboard already has Base directory = web. Do NOT also set [build].base here —
# combining UI base=web with toml base=web made the Next plugin treat publish as
# "web" (same as the site base) and fail with:
#   "Your publish directory cannot be the same as the base directory of your site"
#
# publish = ".next" is relative to the UI base (web/), so the plugin sees
# web/.next — not the base dir. The plugin remaps this after its check.
# (Older "do not set publish=.next" notes applied when UI base was empty and
# the plugin looked at repo-root .next.)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "lib/supabase/client.ts,web/lib/supabase/client.ts"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'"
