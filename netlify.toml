# Monorepo root — Netlify base directory is web/
#
# Do NOT set publish = ".next". @netlify/plugin-nextjs owns the publish
# directory. Forcing publish=.next causes /_next/static/* 404s.

[build]
  base = "web"
  command = "npm run build"
  # publish left unset — Next.js plugin sets it at build time.

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
