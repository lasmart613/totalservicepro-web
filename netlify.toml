# Monorepo root — site base is web/
# Catch-all redirects removed (they broke Next.js Runtime → 404).

[build]
  base = "web"
  command = "npm run build"
  # publish intentionally omitted — @netlify/plugin-nextjs manages it

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
