# Total Service Pro — Netlify + Next.js Runtime
#
# Do NOT set publish = ".next". @netlify/plugin-nextjs owns the publish
# directory and asset mapping. Forcing publish=.next causes
# /_next/static/* 404s → browser "This page couldn't load".

[build]
  command = "npm run build"
  # Leave publish empty / omit — Next.js plugin sets it at build time.
  # publish = ""

[build.environment]
  NODE_VERSION = "20"
  # Ensure client env is available at build if not only in UI
  # (also set NEXT_PUBLIC_* in Netlify dashboard)

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
