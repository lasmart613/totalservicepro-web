# Next.js Runtime (@netlify/plugin-nextjs) owns publish path + routing.
# Do NOT set publish = ".next" and do NOT add catch-all redirects —
# those produce site-wide 404s with App Router + the OpenNext/Netlify handler.

[build]
  command = "npm run build"
  # publish intentionally omitted — plugin manages it

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
