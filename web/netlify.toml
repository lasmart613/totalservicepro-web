# Copied into the UI base (web/). Same publish rule as the repo-root file:
# publish must not equal the site base or @netlify/plugin-nextjs fails.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Site UI Node is 20.20.2. This sets the build command (`next build`) only.
  # @netlify/plugin-nextjs still runs on Netlify's system Node (22) when the
  # build Node is below 22.12 — NODE_VERSION does not move that plugin step.
  NODE_VERSION = "20.20.2"
  SECRETS_SCAN_OMIT_PATHS = "lib/supabase/client.ts,web/lib/supabase/client.ts,public/.well-known/assetlinks.json,web/public/.well-known/assetlinks.json"
  # Public Android signing-cert SHA-256. Not a secret. Smart detection treats
  # certificate-like strings as secrets; safelist this fingerprint.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "51:F4:F1:B9:A7:7D:7E:CD:AB:6B:34:B0:4D:1A:06:B2:0B:9F:C6:91:4E:83:51:5F:22:40:AB:51:A2:A3:43:E9"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# /ads.txt must stay a static text/plain file (Google AdSense crawler).
# There is no /* SPA rewrite in this toml; Next.js Runtime still 404s unknown
# paths as HTML. public/ads.txt is served by Netlify before that handler
# (same as public/*.svg). This header pins the MIME type the crawler expects.
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# robots.txt stays a static public file. /sitemap.xml is generated by
# app/sitemap.ts; this header still pins the XML MIME type.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Android Digital Asset Links. Must be 200 application/json with no redirect.
# www.repairplanet.net → apex is Netlify's primary-domain redirect (Domain
# management), not a rule in this file. That redirect runs before site
# redirects, so this file cannot exempt /.well-known/assetlinks.json on www
# while repairplanet.net is the primary domain. There is no [[redirects]]
# entry and no _redirects file.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://partner.googleadservices.com https://www.googletagservices.com https://tpc.googlesyndication.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net https://*.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://www.google.com; worker-src 'self' blob:; frame-ancestors 'none'"
