# Next.js Runtime (@netlify/plugin-nextjs) owns publish path + routing.
#
# CRITICAL — site-wide 404 root causes we hit:
# 1) Netlify UI "Publish directory" set to ".next" → no server function routes
# 2) Local Windows `netlify deploy --prod --build` → often uploads 0 functions
#    or a win32-bundled handler that 502s on Linux
#
# Prefer: trigger a Netlify cloud (Linux) build from the linked GitHub repo
# (Build hooks / git push). Leave Publish directory EMPTY in the Netlify UI.

[build]
  command = "npm run build"
  # publish intentionally omitted — plugin manages it

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
