# Copied into the UI base (web/). Same publish rule as the repo-root file:
# publish must not equal the site base or @netlify/plugin-nextjs fails.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "lib/supabase/client.ts,web/lib/supabase/client.ts"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# God Email blast (/api/god/blast/send) is still a sync Next.js route:
# sequential Resend + god_email_sends writes. A 647-clinic send died mid-flight
# (~155 logged) on the default serverless timeout.
#
# The route exports maxDuration = 60 and processes at most 50 recipients per
# invocation. The God UI auto-loops remaining_organization_ids / resume_token.
# OpenNext maps App Router API routes through ___netlify-server-handler, so
# this timeout applies to the shared Next server function.
[functions."___netlify-server-handler"]
  timeout = 60

# /ads.txt must stay a static text/plain file (Google AdSense crawler).
# There is no /* SPA rewrite in this toml; Next.js Runtime still 404s unknown
# paths as HTML. public/ads.txt is served by Netlify before that handler
# (same as public/*.svg). This header pins the MIME type the crawler expects.
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Same static-file pattern as ads.txt: public/robots.txt and public/sitemap.xml
# are served by Netlify before the Next 404 HTML shell.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://partner.googleadservices.com https://www.googletagservices.com https://tpc.googlesyndication.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net https://*.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://www.google.com; worker-src 'self' blob:; frame-ancestors 'none'"
