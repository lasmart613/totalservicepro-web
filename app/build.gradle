plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photometrytools'
    compileSdk 36

    defaultConfig {
        applicationId "com.photometrytools"
        minSdk 24
        targetSdk 36
        versionCode 45
        versionName "0.5.3-beta"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def uploadStore = System.getenv("TSP_UPLOAD_STORE_FILE")

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (uploadStore) {
                storeFile file(uploadStore)
                storePassword System.getenv("TSP_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("TSP_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("TSP_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists() || uploadStore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'  // optional but recommended

    // Material Components (fixes BottomNavigationView crash)
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:6.2.1'
    // Bundled Latin model. Recognition stays on the device; this artifact does not download a model.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Unit tests. The SDK's org.json is a stub in local unit tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // Android instrumentation tests (updated versions)
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}